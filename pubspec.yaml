name: livemcq3
description: LiveMCQ3 - Coaching & Career Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.0
  riverpod_generator: ^2.4.0

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.0.0

  # Routing
  go_router: ^18.0.0

  # Firebase / Push
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF
  syncfusion_flutter_pdfviewer: ^34.2.5

  # WebView (bKash)
  webview_flutter: ^4.7.0

  # UI Utilities
  shimmer: ^3.0.0

  # Utilities
  equatable: ^2.0.5
  permission_handler: ^13.0.1
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.2
  local_auth: ^3.0.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
